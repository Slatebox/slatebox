apiVersion: v1
kind: Namespace
metadata:
  name: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
---
apiVersion: v1
kind: Secret
metadata:
  name: slatebox-env
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
type: Opaque
stringData:
  SLATEBOX_KEY_ENCRYPTION_KEY: placeholder
  SLATEBOX_MAIL_URL: placeholder
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slatebox-config
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
data:
  SLATEBOX_URL: https://boards.example.com
  SLATEBOX_HTTPS: "off"
  SLATEBOX_MAIL_FROM: "Slatebox <b@example.com>"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slatebox
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
spec:
  serviceName: slatebox
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slatebox
      app.kubernetes.io/instance: slatebox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slatebox
        app.kubernetes.io/instance: slatebox
        app.kubernetes.io/managed-by: slatebox-installer
        slatebox.com/install: slatebox
      annotations:
        slatebox.com/config-hash: ddf404a2ca990c02
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: slatebox
        image: ghcr.io/slatebox/slatebox@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 7070
        envFrom:
        - configMapRef:
            name: slatebox-config
        - secretRef:
            name: slatebox-env
        volumeMounts:
        - name: data
          mountPath: /data
        - name: run
          mountPath: /run/slatebox
        startupProbe:
          exec:
            command:
            - /opt/slatebox/bin/slatebox
            - health
          timeoutSeconds: 10
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - /opt/slatebox/bin/slatebox
            - health
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 1Gi
            cpu: "1"
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: run
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: slatebox
        app.kubernetes.io/instance: slatebox
        app.kubernetes.io/managed-by: slatebox-installer
        slatebox.com/install: slatebox
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slatebox
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
  ports:
  - name: http
    port: 7070
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slatebox
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
spec:
  parentRefs:
  - name: public
    namespace: infra
  hostnames:
  - boards.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: slatebox
      port: 7070
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slatebox-install
  namespace: slatebox
  labels:
    app.kubernetes.io/name: slatebox
    app.kubernetes.io/instance: slatebox
    app.kubernetes.io/managed-by: slatebox-installer
    slatebox.com/install: slatebox
data:
  install.yaml: "name: slatebox\n"
