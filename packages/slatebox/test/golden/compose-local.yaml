# Written by the slatebox installer for the install "slatebox".
# Start it with `docker compose up -d --wait` next to slatebox.env and secrets.env.
name: slatebox
services:
  slatebox:
    image: ghcr.io/slatebox/slatebox@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    container_name: slatebox
    restart: unless-stopped
    ports:
    - 127.0.0.1:7070:7070
    volumes:
    - data:/data
    env_file:
    - slatebox.env
    - secrets.env
    labels:
      com.slatebox.install: slatebox
      app.kubernetes.io/managed-by: slatebox-installer
volumes:
  data:
    name: slatebox-data
