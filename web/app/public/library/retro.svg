<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-retro{font:600 7px system-ui,sans-serif;fill:#24312e}.t-retro{font:5.5px system-ui,sans-serif;fill:#24312e}.m-retro,.r-retro,.d-retro{animation:5s ease-in-out infinite}@keyframes mv-retro{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(100px,13px)}52%{transform:translate(102px,13px)}56%{transform:translate(98px,13px)}88%,100%{transform:translate(0,0)}}.m-retro{animation-name:mv-retro}@keyframes dm-retro{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-retro{animation-name:dm-retro;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-retro,.r-retro,.d-retro{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="48" height="64" rx="3" fill="#d5e9e3"/><text class="t-retro" x="30" y="14" text-anchor="middle">Went well</text><rect x="9" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="56" y="6" width="48" height="64" rx="3" fill="#fbdfac"/><text class="t-retro" x="80" y="14" text-anchor="middle">Change</text><rect class="d-retro" x="106" y="6" width="48" height="64" rx="3" fill="#dedef4"/><text class="t-retro" x="130" y="14" text-anchor="middle">Try</text><rect x="109" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="109" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect class="m-retro" x="9" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-retro" x="80" y="84" text-anchor="middle">Try holds 3.</text></svg>
