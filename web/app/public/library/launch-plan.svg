<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-launch-plan{font:600 7px system-ui,sans-serif;fill:#24312e}.t-launch-plan{font:5.5px system-ui,sans-serif;fill:#24312e}.m-launch-plan,.r-launch-plan,.d-launch-plan{animation:5s ease-in-out infinite}@keyframes mv-launch-plan{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(18px,0);fill:#c2410c}85%,100%{transform:translate(0,0)}}.m-launch-plan{animation-name:mv-launch-plan}@media (prefers-reduced-motion:reduce){.m-launch-plan,.r-launch-plan,.d-launch-plan{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><line x1="132" y1="6" x2="132" y2="70" stroke="#1f7a5c" stroke-width="1.2" stroke-dasharray="2 1.5"/><text class="t-launch-plan" x="132" y="76" text-anchor="middle">launch</text><rect x="15" y="9" width="28.88888888888889" height="10" rx="2" fill="#d5e9e3" stroke="#24312e" stroke-width=".4"/><text class="t-launch-plan" x="17" y="16">Design</text><rect x="35.22222222222222" y="24" width="43.333333333333336" height="10" rx="2" fill="#fbdfac" stroke="#24312e" stroke-width=".4"/><text class="t-launch-plan" x="37.22222222222222" y="31">Build</text><rect x="65.55555555555556" y="39" width="14.444444444444445" height="10" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-launch-plan" x="67.55555555555556" y="46">QA</text><rect class="m-launch-plan" x="75.66666666666667" y="54" width="14.444444444444445" height="10" rx="2" fill="#dcebf3" stroke="#24312e" stroke-width=".4"/><text class="t-launch-plan" x="77.66666666666667" y="61">Copy</text><text class="c-launch-plan" x="80" y="84" text-anchor="middle">A slip pushes the tasks that wait on it.</text></svg>
