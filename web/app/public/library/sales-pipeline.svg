<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-sales-pipeline{font:600 7px system-ui,sans-serif;fill:#24312e}.t-sales-pipeline{font:5.5px system-ui,sans-serif;fill:#24312e}.m-sales-pipeline,.r-sales-pipeline,.d-sales-pipeline{animation:5s ease-in-out infinite}@keyframes mv-sales-pipeline{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(60px,13px)}52%{transform:translate(62px,13px)}56%{transform:translate(58px,13px)}88%,100%{transform:translate(0,0)}}.m-sales-pipeline{animation-name:mv-sales-pipeline}@keyframes dm-sales-pipeline{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-sales-pipeline{animation-name:dm-sales-pipeline;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-sales-pipeline,.r-sales-pipeline,.d-sales-pipeline{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="28" height="64" rx="3" fill="#d5e9e3"/><text class="t-sales-pipeline" x="20" y="14" text-anchor="middle">Lead</text><rect x="9" y="19" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="36" y="6" width="28" height="64" rx="3" fill="#fbdfac"/><text class="t-sales-pipeline" x="50" y="14" text-anchor="middle">Qualified</text><rect class="d-sales-pipeline" x="66" y="6" width="28" height="64" rx="3" fill="#dedef4"/><text class="t-sales-pipeline" x="80" y="14" text-anchor="middle">Proposal</text><rect x="69" y="19" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="69" y="32" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="96" y="6" width="28" height="64" rx="3" fill="#dcebf3"/><text class="t-sales-pipeline" x="110" y="14" text-anchor="middle">Won</text><rect x="126" y="6" width="28" height="64" rx="3" fill="#efd7dc"/><text class="t-sales-pipeline" x="140" y="14" text-anchor="middle">Lost</text><rect class="m-sales-pipeline" x="9" y="32" width="22" 