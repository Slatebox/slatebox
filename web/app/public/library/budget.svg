<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-budget{font:600 7px system-ui,sans-serif;fill:#24312e}.t-budget{font:5.5px system-ui,sans-serif;fill:#24312e}.m-budget,.r-budget,.d-budget{animation:5s ease-in-out infinite}@keyframes mv-budget{0%,15%,85%,100%{transform:scaleX(1)}45%,60%{transform:scaleX(1.25)}}.m-budget{animation-name:mv-budget;transform-box:fill-box;transform-origin:left}@media (prefers-reduced-motion:reduce){.m-budget,.r-budget,.d-budget{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect class="m-budget" x="8" y="24" width="48" height="22" fill="#d5e9e3" stroke="#24312e" stroke-width=".4"/><text class="t-budget" x="10" y="38">Product</text><rect x="56" y="24" width="48" height="22" fill="#fbdfac" stroke="#24312e" stroke-width=".4"/><text class="t-budget" x="58" y="38">Sales</text><rect x="104" y="24" width="18" height="22" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-budget" x="106" y="38">Design</text><rect x="122" y="24" width="30" height="22" fill="#dcebf3" stroke="#24312e" stroke-width=".4"/><text class="t-budget" x="124" y="38">Marketing</text><text class="t-budget" x="80" y="16" text-anchor="middle">$1200k total</text><text class="c-budget" x="80" y="84" text-anchor="middle">The total stays fixed.</text></svg>
