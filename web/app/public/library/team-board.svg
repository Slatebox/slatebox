<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-team-board{font:600 7px system-ui,sans-serif;fill:#24312e}.t-team-board{font:5.5px system-ui,sans-serif;fill:#24312e}.m-team-board,.r-team-board,.d-team-board{animation:5s ease-in-out infinite}@keyframes mv-team-board{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(30px,13px)}52%{transform:translate(32px,13px)}56%{transform:translate(28px,13px)}88%,100%{transform:translate(0,0)}}.m-team-board{animation-name:mv-team-board}@keyframes dm-team-board{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-team-board{animation-name:dm-team-board;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-team-board,.r-team-board,.d-team-board{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="28" height="64" rx="3" fill="#d5e9e3"/><text class="t-team-board" x="20" y="14" text-anchor="middle">To do</text><rect x="9" y="19" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect class="d-team-board" x="36" y="6" width="28" height="64" rx="3" fill="#fbdfac"/><text class="t-team-board" x="50" y="14" text-anchor="middle">Doing</text><rect x="39" y="19" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="39" y="32" width="22" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="66" y="6" width="28" height="64" rx="3" fill="#dedef4"/><text class="t-team-board" x="80" y="14" text-anchor="middle">Review</text><rect x="96" y="6" width="28" height="64" rx="3" fill="#dcebf3"/><text class="t-team-board" x="110" y="14" text-anchor="middle">Done</text><rect x="126" y="6" width="28" height="64" rx="3" fill="#efd7dc"/><text class="t-team-board" x="140" y="14" text-anchor="middle">Won't do</text><rect class="m-team-board" x="9" y="32" width="22" height="10" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-team-board" x="80" y="84" text-anchor="middle">Doing holds 3.</text></svg>
