<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-triage{font:600 7px system-ui,sans-serif;fill:#24312e}.t-triage{font:5.5px system-ui,sans-serif;fill:#24312e}.m-triage,.r-triage,.d-triage{animation:5s ease-in-out infinite}@keyframes mv-triage{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(37.5px,13px)}52%{transform:translate(39.5px,13px)}56%{transform:translate(35.5px,13px)}88%,100%{transform:translate(0,0)}}.m-triage{animation-name:mv-triage}@keyframes dm-triage{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-triage{animation-name:dm-triage;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-triage,.r-triage,.d-triage{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="35.5" height="64" rx="3" fill="#d5e9e3"/><text class="t-triage" x="23.75" y="14" text-anchor="middle">New</text><rect x="9" y="19" width="29.5" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect class="d-triage" x="43.5" y="6" width="35.5" height="64" rx="3" fill="#fbdfac"/><text class="t-triage" x="61.25" y="14" text-anchor="middle">Today</text><rect x="46.5" y="19" width="29.5" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="46.5" y="32" width="29.5" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="81" y="6" width="35.5" height="64" rx="3" fill="#dedef4"/><text class="t-triage" x="98.75" y="14" text-anchor="middle">Waiting</text><rect x="118.5" y="6" width="35.5" height="64" rx="3" fill="#dcebf3"/><text class="t-triage" x="136.25" y="14" text-anchor="middle">Done</text><rect class="m-triage" x="9" y="32" width="29.5" height="10" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-triage" x="80" y="84" text-anchor="middle">Today holds 3.</text></svg>
