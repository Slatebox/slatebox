<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-now-next-later{font:600 7px system-ui,sans-serif;fill:#24312e}.t-now-next-later{font:5.5px system-ui,sans-serif;fill:#24312e}.m-now-next-later,.r-now-next-later,.d-now-next-later{animation:5s ease-in-out infinite}@keyframes mv-now-next-later{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(50px,13px)}52%{transform:translate(52px,13px)}56%{transform:translate(48px,13px)}88%,100%{transform:translate(0,0)}}.m-now-next-later{animation-name:mv-now-next-later}@keyframes dm-now-next-later{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-now-next-later{animation-name:dm-now-next-later;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-now-next-later,.r-now-next-later,.d-now-next-later{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="48" height="64" rx="3" fill="#d5e9e3"/><text class="t-now-next-later" x="30" y="14" text-anchor="middle">Now</text><rect x="9" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect class="d-now-next-later" x="56" y="6" width="48" height="64" rx="3" fill="#fbdfac"/><text class="t-now-next-later" x="80" y="14" text-anchor="middle">Next</text><rect x="59" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="59" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="106" y="6" width="48" height="64" rx="3" fill="#dedef4"/><text class="t-now-next-later" x="130" y="14" text-anchor="middle">Later</text><rect class="m-now-next-later" x="9" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-now-next-later" x="80" y="84" text-anchor="middle">Next holds 3.</text></svg>
