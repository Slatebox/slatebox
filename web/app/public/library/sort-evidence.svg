<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-sort-evidence{font:600 7px system-ui,sans-serif;fill:#24312e}.t-sort-evidence{font:5.5px system-ui,sans-serif;fill:#24312e}.m-sort-evidence,.r-sort-evidence,.d-sort-evidence{animation:5s ease-in-out infinite}@keyframes mv-sort-evidence{0%,12%{transform:translate(0,0)}45%,85%{transform:translate(-50px,12px)}100%{transform:translate(0,0)}}.m-sort-evidence{animation-name:mv-sort-evidence}@keyframes rk-sort-evidence{0%,50%,100%{transform:translate(0,0)}60%,90%{transform:translate(50px,0)}}.r-sort-evidence{animation-name:rk-sort-evidence}@keyframes rd-sort-evidence{0%,50%,100%{transform:translate(0,0)}60%,90%{transform:translate(-50px,0)}}.d-sort-evidence{animation-name:rd-sort-evidence}@media (prefers-reduced-motion:reduce){.m-sort-evidence,.r-sort-evidence,.d-sort-evidence{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><g class="r-sort-evidence"><rect x="8" y="8" width="44" height="12" rx="2" fill="#fbdfac" stroke="#24312e" stroke-width=".4"/><text class="t-sort-evidence" x="11" y="16">Onboarding</text><rect x="12" y="24" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="12" y="36" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="12" y="48" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/></g><g class="d-sort-evidence"><rect x="58" y="8" width="44" height="12" rx="2" fill="#fbdfac" stroke="#24312e" stroke-width=".4"/><text class="t-sort-evidence" x="61" y="16">Reporting</text><rect x="62" y="24" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="62" y="36" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/></g><g><rect x="108" y="8" width="44" height="12" rx="2" fill="#fbdfac" stroke="#24312e" stroke-width=".4"/><text class="t-sort-evidence" x="111" y="16">Pricing</text><rect x="112" y="24" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="112" y="36" width="40" height="9" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/></g><rect class="m-sort-evidence" x="62" y="48" width="40" height="9" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-sort-evidence" x="80" y="84" text-anchor="middle">Piles rank by number of customers.</text></svg>
