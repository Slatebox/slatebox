<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-incident-review{font:600 7px system-ui,sans-serif;fill:#24312e}.t-incident-review{font:5.5px system-ui,sans-serif;fill:#24312e}.m-incident-review,.r-incident-review,.d-incident-review{animation:5s ease-in-out infinite}@keyframes mv-incident-review{0%,15%{transform:translate(0,0)}45%,60%{transform:translate(50px,-34px)}52%{transform:translate(53px,-34px)}56%{transform:translate(47px,-34px)}85%,100%{transform:translate(0,0)}}.m-incident-review{animation-name:mv-incident-review}@keyframes dm-incident-review{0%,40%,64%,100%{stroke:#24312e}46%,60%{stroke:#c2410c;stroke-width:1.2}}.d-incident-review{animation-name:dm-incident-review}@media (prefers-reduced-motion:reduce){.m-incident-review,.r-incident-review,.d-incident-review{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect class="d-incident-review" x="55" y="6" width="50" height="12" rx="2" fill="#d5e9e3" stroke="#24312e" stroke-width=".4"/><text class="t-incident-review" x="58" y="14">Sign-in outag</text><line x1="80" y1="18" x2="30" y2="28" stroke="#b5bdb3" stroke-width=".8"/><rect x="6" y="28" width="48" height="12" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-incident-review" x="9" y="36">Expired cert</text><line x1="80" y1="18" x2="82" y2="28" stroke="#b5bdb3" stroke-width=".8"/><rect x="58" y="28" width="48" height="12" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-incident-review" x="61" y="36">Slow rollbac</text><line x1="30" y1="40" x2="30" y2="50" stroke="#b5bdb3" stroke-width=".8"/><rect class="m-incident-review" x="8" y="50" width="44" height="11" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-incident-review" x="80" y="84" text-anchor="middle">Actions sit under a cause (a warning only).</text></svg>
