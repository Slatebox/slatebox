<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-discovery-tree{font:600 7px system-ui,sans-serif;fill:#24312e}.t-discovery-tree{font:5.5px system-ui,sans-serif;fill:#24312e}.m-discovery-tree,.r-discovery-tree,.d-discovery-tree{animation:5s ease-in-out infinite}@keyframes mv-discovery-tree{0%,15%{transform:translate(0,0)}45%,60%{transform:translate(50px,-34px)}52%{transform:translate(53px,-34px)}56%{transform:translate(47px,-34px)}85%,100%{transform:translate(0,0)}}.m-discovery-tree{animation-name:mv-discovery-tree}@keyframes dm-discovery-tree{0%,40%,64%,100%{stroke:#24312e}46%,60%{stroke:#c2410c;stroke-width:1.2}}.d-discovery-tree{animation-name:dm-discovery-tree}@media (prefers-reduced-motion:reduce){.m-discovery-tree,.r-discovery-tree,.d-discovery-tree{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect class="d-discovery-tree" x="55" y="6" width="50" height="12" rx="2" fill="#d5e9e3" stroke="#24312e" stroke-width=".4"/><text class="t-discovery-tree" x="58" y="14">Activation to</text><line x1="80" y1="18" x2="30" y2="28" stroke="#b5bdb3" stroke-width=".8"/><rect x="6" y="28" width="48" height="12" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-discovery-tree" x="9" y="36">Onboarding i</text><line x1="80" y1="18" x2="82" y2="28" stroke="#b5bdb3" stroke-width=".8"/><rect x="58" y="28" width="48" height="12" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-discovery-tree" x="61" y="36">Data trust</text><line x1="80" y1="18" x2="134" y2="28" stroke="#b5bdb3" stroke-width=".8"/><rect x="110" y="28" width="48" height="12" rx="2" fill="#dedef4" stroke="#24312e" stroke-width=".4"/><text class="t-discovery-tree" x="113" y="36">Hard to shar</text><line x1="30" y1="40" x2="30" y2="50" stroke="#b5bdb3" stroke-width=".8"/><rect class="m-discovery-tree" x="8" y="50" width="44" height="11" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/