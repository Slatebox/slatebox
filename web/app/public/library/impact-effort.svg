<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-impact-effort{font:600 7px system-ui,sans-serif;fill:#24312e}.t-impact-effort{font:5.5px system-ui,sans-serif;fill:#24312e}.m-impact-effort,.r-impact-effort,.d-impact-effort{animation:5s ease-in-out infinite}@keyframes mv-impact-effort{0%,15%{transform:translate(0,0)}45%,60%{transform:translate(-100px,-36px)}85%,100%{transform:translate(0,0)}}.m-impact-effort{animation-name:mv-impact-effort}@keyframes dm-impact-effort{0%,40%,64%,100%{stroke:none}46%,60%{stroke:#c2410c;stroke-width:1.2}}.d-impact-effort{animation-name:dm-impact-effort}@media (prefers-reduced-motion:reduce){.m-impact-effort,.r-impact-effort,.d-impact-effort{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect class="d-impact-effort" x="8" y="6" width="70" height="30" rx="2" fill="#d5e9e3"/><rect x="80" y="6" width="70" height="30" rx="2" fill="#dedef4"/><rect x="8" y="38" width="70" height="30" rx="2" fill="#f3eee0"/><rect x="80" y="38" width="70" height="30" rx="2" fill="#efd7dc"/><text class="t-impact-effort" x="11" y="13">Do now</text><rect x="50" y="18" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect x="64" y="12" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect x="36" y="30" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect x="134" y="24" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect x="106" y="30" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect x="36" y="48" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><rect class="m-impact-effort" x="134" y="54" width="12" height="5" rx="1" fill="#fffdf6" stroke="#24312e" stroke-width=".4"/><text class="c-impact-effort" x="80" y="84" text-anchor="middle">Do now holds 3.</text></svg>
