<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" class="sb-loop-svg"><style>.c-pros-cons{font:600 7px system-ui,sans-serif;fill:#24312e}.t-pros-cons{font:5.5px system-ui,sans-serif;fill:#24312e}.m-pros-cons,.r-pros-cons,.d-pros-cons{animation:5s ease-in-out infinite}@keyframes mv-pros-cons{0%,12%{transform:translate(0,0)}40%,60%{transform:translate(50px,13px)}52%{transform:translate(52px,13px)}56%{transform:translate(48px,13px)}88%,100%{transform:translate(0,0)}}.m-pros-cons{animation-name:mv-pros-cons}@keyframes dm-pros-cons{0%,38%,66%,100%{opacity:1}44%,60%{opacity:.45;stroke:#c2410c}}.d-pros-cons{animation-name:dm-pros-cons;stroke-width:1}@media (prefers-reduced-motion:reduce){.m-pros-cons,.r-pros-cons,.d-pros-cons{animation:none}}</style><rect width="160" height="90" rx="6" fill="#faf8f2"/><rect x="6" y="6" width="48" height="64" rx="3" fill="#d5e9e3"/><text class="t-pros-cons" x="30" y="14" text-anchor="middle">Pros</text><rect x="9" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect class="d-pros-cons" x="56" y="6" width="48" height="64" rx="3" fill="#fbdfac"/><text class="t-pros-cons" x="80" y="14" text-anchor="middle">Cons</text><rect x="59" y="19" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="59" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#b9b3a3" stroke-width=".5"/><rect x="106" y="6" width="48" height="64" rx="3" fill="#dedef4"/><text class="t-pros-cons" x="130" y="14" text-anchor="middle">Questions</text><rect class="m-pros-cons" x="9" y="32" width="42" height="10" rx="2" fill="#fffdf6" stroke="#24312e" stroke-width=".6"/><text class="c-pros-cons" x="80" y="84" text-anchor="middle">No rules: any card goes in any lane.</text></svg>
