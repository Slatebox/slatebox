# Categories for GitHub's "Generate release notes" button. The Release workflow writes each
# release's notes from the changelog instead (see docs/releasing.md); this file only shapes
# notes someone generates by hand, by pull request label.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - github-actions
    - title: Other changes
      labels:
        - "*"
