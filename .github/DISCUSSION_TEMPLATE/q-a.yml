title: "[Q&A] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. A quick search of [docs.slatebox.com](https://docs.slatebox.com) and earlier answers here often turns it up fast.
        Found a bug instead? Please [open an issue](https://github.com/Slatebox/slatebox/issues/new/choose). Security reports go through [SECURITY.md](https://github.com/Slatebox/slatebox/blob/main/SECURITY.md), not here.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Steps, links to docs pages, screenshots or error text.
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: Where are you using Slatebox?
      options:
        - app.slatebox.com
        - Self-hosted
        - SlateboxJS engine in my own app
        - MCP server or CLI with an agent
        - Other
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version (if self-hosted or using the engine)
      placeholder: e.g. 0.2.1
    validations:
      required: false
