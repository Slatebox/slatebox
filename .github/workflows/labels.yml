# Applies .github/labels.yml to the repository's labels. Labels that are not in the file
# are kept (skip-delete), so nothing in use disappears.
name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916  # v5.3.0
        with:
          github-token: ${{ github.token }}
          yaml-file: .github/labels.yml
          skip-delete: true
