name: Bug report
description: Something in Slatebox isn't working the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Questions are best asked in [Q&A](https://github.com/Slatebox/slatebox/discussions/categories/q-a). A security problem goes through a [private report](https://github.com/Slatebox/slatebox/security/advisories/new), never a public issue (see [SECURITY.md](https://github.com/Slatebox/slatebox/blob/main/SECURITY.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a slate
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - app.slatebox.com
        - Self-hosted (the ghcr.io/slatebox/slatebox image)
        - The npx slatebox installer or CLI
        - The MCP server (hosted or slatebox-mcp)
        - The SlateboxJS engine in my own app
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Self-hosted: the image tag (`docker inspect slatebox --format '{{.Config.Image}}'`). Installer: `npx slatebox --version`. MCP: `npm ls -g slatebox-mcp`. Leave empty for app.slatebox.com."
      placeholder: e.g. 0.2.2
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 131 on macOS
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please remove keys, tokens and personal data first.
