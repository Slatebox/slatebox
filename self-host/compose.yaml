services:
  proxy:
    image: caddy:2.11.9
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SLATEBOX_APP_HOST: ${SLATEBOX_APP_HOST:-}
      SLATEBOX_RELAY_HOST: ${SLATEBOX_RELAY_HOST:-}
    ports:
      - "${SLATEBOX_HTTP_BIND:-80}:80"
      - "${SLATEBOX_HTTPS_BIND:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/apps/http/servers/']
      interval: 5s
      timeout: 3s
      retries: 12
  mongo:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run ./run init}
      REPLICA_KEY: ${REPLICA_KEY:?Run ./run init}
    entrypoint: [bash, -ec]
    command:
      - |
        umask 077
        install -d -o root -g mongodb -m 0750 /run/slatebox-mongo
        printf '%s' "$$REPLICA_KEY" > /run/slatebox-mongo/replica.key
        chown mongodb:mongodb /run/slatebox-mongo/replica.key
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /run/slatebox-mongo/replica.key
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --host mongo --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"']
      interval: 5s
      timeout: 5s
      retries: 60

  mongo-init:
    image: mongo:8.0.17
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run ./run init}
      APP_PASSWORD: ${APP_PASSWORD:?Run ./run init}
      RELAY_PASSWORD: ${RELAY_PASSWORD:?Run ./run init}
    volumes:
      - type: bind
        source: ./mongo-init.js
        target: /opt/slatebox/mongo-init.js
        read_only: true
        bind:
          create_host_path: false
    entrypoint: [mongosh, --quiet, --host, mongo, --file, /opt/slatebox/mongo-init.js]

  collab:
    image: ${COLLAB_IMAGE:?Set the collaboration image}
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URL: mongodb://relay:${RELAY_PASSWORD}@mongo:27017/slatebox?replicaSet=rs0
      API_GEN_KEY: ${API_GEN_KEY}
      API_KEYS: ${API_KEYS}
      # Room tokens only: the room-less legacy credential is refused.
      RELAY_ALLOW_LEGACY: "false"
    ports:
      - "127.0.0.1:${COLLAB_PORT}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(async r=>process.exit(r.ok && (await r.text()).includes('Websocket') ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:?Set the app image}
    restart: unless-stopped
    depends_on:
      collab:
        condition: service_healthy
    environment:
      ROOT_URL: ${ROOT_URL}
      PORT: 3000
      MONGO_URL: mongodb://app:${APP_PASSWORD}@mongo:27017/slatebox?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://app:${APP_PASSWORD}@mongo:27017/local?authSource=slatebox&replicaSet=rs0
      API_KEY_DEEP_INFRA: ${API_KEY_DEEP_INFRA:-}
      # Optional provider keys, read only by a settings.json connection that names one in apiKeyEnv
      # (self-host/README.md). Add any other variable a connection names here and in instance.env.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      # Proxies in front of the app that add an X-Forwarded-For entry (self-host/README.md).
      HTTP_FORWARDED_COUNT: ${HTTP_FORWARDED_COUNT:-}
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    volumes:
      - type: bind
        source: ${SLATEBOX_STATE}/settings.json
        target: /opt/slatebox/settings.json
        read_only: true
        bind:
          create_host_path: false
    entrypoint: [sh, -ec]
    command:
      - |
        export METEOR_SETTINGS="$$(cat /opt/slatebox/settings.json)"
        exec /docker/entrypoint.sh node main.js
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(async r=>process.exit(r.ok && (await r.json()).ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 8s
      timeout: 5s
      start_period: 45s
      retries: 25

volumes:
  mongo-data:
  caddy-data:
