# gitleaks configuration for the public Slatebox app repository.
#
# The default rules apply. The allowlists below cover only values that are
# proven fake (test fixtures); each one says why.
# A real key never belongs in this repository: settings live in git-ignored
# settings files locally and in METEOR_SETTINGS when deployed. The ship's public-tree
# gate runs gitleaks with this file and refuses a tree with any other finding.

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures: made-up API keys built from the digits 0123456789 (e.g. 'k-0123456789', 'sk-test-0123456789', 'desk-key-0123456789', 'di-0123456789abcdef4f2a') and 'secret-key-123456'. They exercise key handling in the AI connection, settings and key-vault tests and never reach a provider."
condition = "AND"
paths = ['''(^|/)scripts/[^/]+\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''0123456789''', '''^secret-key-123456$''']

[[allowlists]]
description = "Test fixture: an idempotency key header value ('plain-remove-2') in the exec API integration test, not a credential."
condition = "AND"
paths = ['''(^|/)scripts/exec-api\.integration\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^plain-remove-\d+$''']

[[allowlists]]
description = "Self-host test fixtures: made-up keys that contain the word 'secret' ('di-secret-12345678', 'sk-provider-…', 'endpoint-secret-1234') in the image's AI settings tests; they never reach a provider."
condition = "AND"
paths = ['''(^|/)self-host/tests/[^/]+\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''secret''']

[[allowlists]]
description = "Not a secret: the path of Keycloak's embedded H2 database inside the image ('h2/keycloakdb')."
condition = "AND"
paths = ['''(^|/)self-host/rootfs/opt/slatebox/lib/sso\.mjs$''']
regexTarget = "secret"
regexes = ['''^h2/keycloakdb$''']

[[allowlists]]
description = "Not a secret: the SHA-256 of the one password every early guest shared, kept so that password is refused everywhere (web/app/server/common/shared-guest-password.mjs)."
condition = "AND"
paths = ['''(^|/)web/app/server/common/shared-guest-password\.mjs$''']
regexTarget = "secret"
regexes = ['''^9dbf8057012e99a692df37f984b92232c1aeee59ba9576be9f440d2ae0bef774$''']

[[allowlists]]
description = "Installer test fixtures: made-up keys built from the digits 0123456789 (e.g. 'sk-test-0123456789', 'ghp_0123456789abcdef…', 'sk_live_51HxAbCdEf0123456789', 'tok_0123456789AbCd…') that check a key is refused or never printed, and the SSH public key file name 'id_ed25519.pub'. None is a credential."
condition = "AND"
paths = ['''(^|/)packages/slatebox/test/.+\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''0123456789''', '''^id_ed25519\.pub$''']

[[allowlists]]
description = "Installer test fixtures: the stand-in for Slatebox Cloud (packages/slatebox/test/fakes.mjs) holds made-up team-address install credentials built from the digits 0123456789 ('sbxi_ab12cd34_fake-install-credential-0123456789'). They check the credential is stored 0600 and never printed; no Slatebox Cloud ever issued them."
condition = "AND"
paths = ['''(^|/)packages/slatebox/test/fakes\.mjs$''']
regexTarget = "secret"
regexes = ['''^sbxi_[a-z0-9]{8}_fake-[a-z-]+-0123456789$''']

[[allowlists]]
description = "Passkey provider AAGUIDs: public authenticator model ids (FIDO MDS, passkey-authenticator-aaguids), not secrets"
condition = "AND"
paths = ['''(^|/)web/app/server/passkeys/core\.mjs$''']
regexTarget = "match"
regexes = ['''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''']
